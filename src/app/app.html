<!-- Ссылка «К содержимому» — самый первый элемент, до которого доходит Tab. Глазами её не видно,
     пока она не в фокусе; с клавиатуры она появляется первой и позволяет перепрыгнуть шапку
     с меню сразу к содержимому страницы (иначе на каждой странице — 5–6 лишних нажатий Tab). -->
<a class="skip-link" href="#main" (click)="skipToMain($event)">{{ 'nav.skipToContent' | t }}</a>

<app-header />
<app-offline-banner />

<!-- id="main" — цель ссылки «К содержимому». tabindex="-1" — фокус сюда ставит код
     (по ссылке), но Tab на самом <main> не останавливается. -->
<main id="main" class="page" tabindex="-1" #main>
  <router-outlet />
</main>

<app-footer />
