<mat-toolbar class="header">
  <a routerLink="/" class="logo">DEAD<span>ISLAND</span></a>

  <span class="spacer"></span>

  <!-- Меню и кнопка «Выйти» видны только вошедшему пользователю.
       @defer — код меню (а с ним и Firestore для уведомлений) скачивается отдельным файлом,
       только когда он реально нужен. Гость его не загружает вовсе. -->
  @if (auth.isLoggedIn()) {
    @defer (on immediate) {
      <app-main-nav />
    }
  }

  <app-language-switcher />

  @if (auth.isLoggedIn()) {
    <button mat-icon-button type="button" (click)="logout()" [attr.aria-label]="'nav.logout' | t">
      <mat-icon>logout</mat-icon>
    </button>
  } @else {
    <a mat-flat-button routerLink="/login" class="login-btn">{{ 'nav.login' | t }}</a>
  }
</mat-toolbar>
