<!-- Пока идёт запрос, кнопка «выключена», но не атрибутом disabled: он выбрасывает фокус
     с кнопки на <body>, и клавиатурный пользователь теряет место на странице.
     disabledInteractive оставляет кнопку фокусируемой и ставит aria-disabled="true" —
     а matMenuTrigger, увидев aria-disabled, сам не открывает меню ни кликом, ни клавишами.
     Вторая страховка — проверка busy() в начале каждого действия в moderation-menu.ts. -->
<!-- Подсказка нужна мыши (навести и прочитать). На сенсорном экране (hover: none) она
     после нажатия «залипала» поверх меню — там её выключаем; имя кнопки даёт aria-label. -->
<button
  mat-icon-button
  type="button"
  [matMenuTriggerFor]="menu"
  [disabled]="busy()"
  disabledInteractive
  [attr.aria-label]="'moderation.menu' | t: { name: name() }"
  [matTooltip]="'moderation.menu' | t: { name: name() }"
  [matTooltipDisabled]="noHover"
>
  <mat-icon>more_vert</mat-icon>
</button>

<mat-menu #menu="matMenu" xPosition="before">
  @if (matched()) {
    <button mat-menu-item type="button" (click)="unmatch()">
      <mat-icon>heart_broken</mat-icon>
      <span>{{ 'moderation.unmatch' | t }}</span>
    </button>
  }
  <button mat-menu-item type="button" (click)="report()">
    <mat-icon>flag</mat-icon>
    <span>{{ 'moderation.report' | t }}</span>
  </button>
  <button mat-menu-item type="button" class="danger" (click)="block()">
    <mat-icon>block</mat-icon>
    <span>{{ 'moderation.block' | t }}</span>
  </button>
</mat-menu>
