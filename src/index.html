<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>DeadIsland</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Exo 2 — запасной фирменный шрифт для кириллицы (и č/ľ/ž словацкого): в Orbitron их нет.
         Google отдаёт его кусками с unicode-range, и браузер скачивает только нужный кусок —
         на английской странице, где весь текст покрывает Orbitron, Exo 2 вообще не грузится.
         Roboto 600 — для кнопок «Мэтч» / «Player 2?» и меток: без него браузер «дорисовывал» жирность
         из 500 и буквы выходили мутными. 300 нигде не используется. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Orbitron:wght@600;800&family=Exo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- FILL@0..1 — переменная ось заливки: по умолчанию значки контурные, а класс .di-filled
         (styles.scss) заливает нужные — например, сердце у кнопки «Мэтч». -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
