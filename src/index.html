    <!-- Exo 2 — запасной фирменный шрифт для кириллицы (и č/ľ/ž словацкого): в Orbitron их нет.

         на английской странице, где весь текст покрывает Orbitron, Exo 2 вообще не грузится. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Orbitron:wght@600;800&family=Exo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
